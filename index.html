<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eshaal Farooq — Designer &amp; Developer</title>
  
  <!-- Editorial Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,800;0,6..96,900;1,6..96,400;1,6..96,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Atmospheric Lighting -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Decorative Corner Flowers (Inspiration Feature) -->
  <div class="corner-flowers" aria-hidden="true">
    <img src="images/flowerr1.png" alt="" class="corner-flowers-img">
  </div>

  <div class="page-wrapper">
    <!-- Top Metadata Bar -->
    <header class="top-bar">
      <div class="meta-tag meta-left">UI/UX &amp; WEB DESIGNER</div>
      <div class="meta-tag meta-right">CREATIVE PORTFOLIO</div>
    </header>

    <!-- Main Editorial Stage -->
    <main class="hero-stage">
      <!-- Giant Editorial Backdrop Title (Letters tightened so full word fits) -->
      <div class="editorial-backdrop" aria-hidden="true">
        <span>PORTFOLIO</span>
      </div>

      <!-- 3-Column Layout: Portrait in center overlaps PORTFOLIO; all text sits under the heading -->
      <div class="hero-grid">
        <!-- Left-hand Column: Statement, Pill Badge, Name -->
        <section class="hero-col hero-left" aria-label="Introduction">
          <p class="hero-statement">
            I DESIGN DIGITAL EXPERIENCES<br>THAT INSPIRE &amp; CONNECT
          </p>

          <div class="status-pill">
            <span class="status-text">AVAILABLE FOR PROJECTS</span>
            <span class="status-icon" aria-hidden="true">&#10022;</span>
          </div>

          <div class="signature-block">
            <h1 class="name-signature">Eshaal Farooq</h1>
          </div>
        </section>

        <!-- Center Column: Cartoon Portrait (The ONLY element overlapping the PORTFOLIO text) -->
        <section class="hero-col hero-center" aria-label="Portrait">
          <div class="portrait-stage">
            <div class="portrait-halo"></div>
            <img 
              src="images/me.png" 
              alt="Cartoon portrait of Eshaal Farooq" 
              class="portrait-image"
            >
          </div>
        </section>

        <!-- Right-hand Column: About Me Paragraph (Under heading, clear of portrait) -->
        <section class="hero-col hero-right" aria-label="About Me">
          <div class="about-block">
            <p class="about-description">
              Hi I’m Eshaal, a Software Engineering student passionate about software design, web development, and building user-focused solutions
            </p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
